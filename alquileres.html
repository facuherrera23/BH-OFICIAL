<style>
:root{--ink:#1b2a41;--bg:#eef1f4;--card:#fff;--line:#d5dbe3;--acc:#0f766e;--warn:#b45309;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:30}
header h1{font:600 17px Georgia,serif;margin:0 auto 0 0}
button,select,input{font:inherit}button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 11px;cursor:pointer}
button.s{background:#fff;color:var(--ink);border:1px solid var(--line)}button.d{background:var(--bad)}header button.s{background:transparent;color:#fff;border-color:#5b6b85}
input,select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;background:#fff}
input[type=checkbox]{width:auto}label{display:block;font-size:12px;color:#51607a;margin-bottom:2px}
.alg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px}.ab{background:#fff;border:3px solid;border-radius:8px;padding:8px 10px;min-height:70px}.ab h4{margin:0 0 6px;font:600 13px system-ui}.ab.rojo{border-color:#dc2626}.ab.amar{border-color:#eab308}.ab.nar{border-color:#f97316}.ab .it{font-size:13px;padding:3px 0;cursor:pointer}.ab .it:hover{text-decoration:underline}@media(max-width:760px){.alg{grid-template-columns:1fr}}
main{padding:0 16px 24px}.g5{display:grid;grid-template-columns:90px 2fr 1.5fr 1fr 1.5fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.selc{position:sticky;top:var(--hh,56px);z-index:5;background:#c9d2de;border:2px solid var(--ink);box-shadow:0 3px 8px #0003}.selc label{font-weight:700;font-size:13px;color:var(--ink)}.selc select{font-size:15px;font-weight:600;border:2px solid var(--acc)}.g5c{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.sub{font:600 12px system-ui;color:#51607a;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
#lista button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:6px}
#lista button.on{border-color:var(--acc);box-shadow:inset 3px 0 var(--acc)}#lista small{display:block;color:#64748b}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font:600 15px Georgia,serif}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sv{display:grid;grid-template-columns:24px 1.2fr 1fr .8fr .9fr 190px;gap:8px;align-items:center;margin-bottom:6px}
.ex{display:grid;grid-template-columns:2fr 1fr 1.2fr 34px;gap:8px;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse}.t td,.t th{padding:6px;border-bottom:1px solid var(--line);text-align:right}.t td:first-child,.t th:first-child{text-align:left}
.tot{font-size:16px;font-weight:600}.ac{display:flex;gap:8px;flex-wrap:wrap}
#print{display:none}
@media(max-width:760px){.g5,.g4,.c5,.g5c{grid-template-columns:1fr 1fr}}
textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical}
/* documentos */
.off{position:absolute;left:0;top:0;z-index:-1;width:210mm;background:#fff}.off .pg{margin:0;box-shadow:none;height:295mm}
.wa{background:#25d366;color:#04361a}
@page{size:A4;margin:0}
#print{display:none}
#print.on{display:block;position:fixed;inset:0;overflow:auto;background:#6b7280;z-index:50;padding-bottom:20px}
.tb{position:sticky;top:0;padding:8px 16px;background:var(--ink);display:flex;gap:8px;z-index:2}
.pg{box-sizing:border-box;width:210mm;height:296mm;margin:14px auto;background:#fff;padding:8mm;box-shadow:0 2px 8px #0006;color:#000;font:11pt Calibri,Carlito,'Segoe UI',Arial,sans-serif;overflow:hidden}
.dc{height:100%;display:flex;flex-direction:column;border:3px solid #000}
.hd{display:flex;justify-content:space-between;padding:6px 10px 8px;line-height:1.35}.hd .nm{font:700 13pt 'Arial Black',Arial,sans-serif}
.rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}.rt img{height:17mm}.lb{color:#e11d1d;font-weight:700}
.bx{border-top:3px solid #000;padding:5px 10px}.kv{display:grid;grid-template-columns:34% 66%;row-gap:2px}.kv b:nth-child(odd){text-align:right;padding-right:18px}
.cnw{flex:1;display:flex;flex-direction:column;border-top:3px solid #000}
.r{display:grid;grid-template-columns:46% 18% 12% 24%}.r>div{padding:2px 8px;border-left:1.5px solid #000}.r>div:first-child{border-left:0}.r>div:nth-child(2),.r>div:nth-child(3){text-align:center}.r>div:last-child{text-align:right}
.r.th{font-weight:700;border-bottom:1.5px solid #000}.r.th>div:nth-child(2){grid-column:span 2}.r.th>div:last-child{text-align:left}
.r.fill{flex:1}.r.tt{border-top:1.5px solid #000}.r.tf{font-weight:700;border-top:1.5px solid #000}
.vw{border-top:3px solid #000}.v{display:grid;grid-template-columns:46% 9% 9% 12% 24%;font-weight:700}.v+.v{border-top:1.5px solid #000}.v>div{padding:2px 8px;border-left:1.5px solid #000;text-align:center}.v>div:first-child{border-left:0}.v>div:last-child{text-align:right}
.bk{border-top:3px solid #000;text-align:center;padding:8px 10px;line-height:1.5}
.nt{border-top:3px solid #000;padding:6px 10px 8px;text-align:center;line-height:1.45}.nt .h{text-align:left;font-weight:700}.nt .ok{font-weight:700;font-size:13pt;margin-top:8px}
.ft{display:block;width:100%}
.pg.land{width:297mm;height:209mm;display:flex;gap:6mm;padding:6mm}.pg.land .dc{flex:1;min-width:0;height:100%;font-size:9.5pt}.land .hd{padding:4px 8px 6px}.land .hd .nm{font-size:11pt}.land .rt img{height:13mm}.land .r>div{padding:1px 6px}.land .bx{padding:3px 8px}.land .kv{grid-template-columns:30% 70%}.land .nt{padding:4px 8px}
@media print{html,body{background:#fff}body>*:not(#print){display:none!important}#print.on{position:static;overflow:visible;background:#fff;padding:0}.tb{display:none}.pg{margin:0;box-shadow:none;page-break-after:always}.pg:last-child{page-break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<header><h1>Administración de alquileres</h1><button class="s" onclick="location.href='admin.html'" title="Volver al panel">← Panel</button><span id="per"></span>
<button class="s" onclick="mesMas(-1)">◀</button><button class="s" onclick="mesMas(1)">Cerrar mes y pasar al siguiente ▶</button>
<button class="s" onclick="vista='res';render()">Resumen</button><button class="s" onclick="HM=ym();vista='hist';render()">Historial / Excel</button>
<button class="s" onclick="imprimirTodo('o')">Todas las órdenes</button><button class="s" onclick="imprimirTodo('l')">Todas las liquidaciones</button>
<button class="wa" onclick="guardarArchivo()" title="Guardar en la nube (alquileres_state)">💾 Guardar</button><span id="est" style="font-size:12px;font-weight:700"></span>
<button class="s" onclick="exportar()">Respaldo (.json)</button><button class="s" onclick="$('#fi').click()">Cargar datos de otro archivo</button>
<input id="fi" type="file" accept=".json,.html" hidden="" onchange="importar(this.files[0]);this.value=''"></header>
<div id="al"></div>
<main><div class="card selc" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><div style="flex:1;min-width:240px"><label>PROPIEDAD CON LA QUE ESTÁS TRABAJANDO</label><select id="sel" onchange="elegir(this.value)"></select></div><button onclick="nueva()">+ Propiedad</button><button class="s" onclick="vista='corr';render()">Datos de la inmobiliaria</button></div><section id="v"><div class="card" style="text-align:center;color:#51607a">Conectando con la base de datos…</div></section></main>
<div id="print" class=""></div>



<!-- GATE DE ACCESO (Supabase auth; comparte la sesión con el panel admin) -->
<div id="alqGate" style="display:none;position:fixed;inset:0;background:#eef1f4;z-index:1000;align-items:center;justify-content:center;">
 <div style="background:#fff;border:1px solid #d5dbe3;border-radius:12px;padding:26px;max-width:360px;width:92%;box-shadow:0 8px 30px rgba(0,0,0,.15)">
  <div style="font:700 15px Georgia,serif;color:#1b2a41">Administración de alquileres</div>
  <div style="font-size:12.5px;color:#51607a;margin:4px 0 16px">Ingresá con tu usuario del panel BIENENHAUS. Cada usuario ve solo sus propiedades.</div>
  <div id="alqGateError" style="display:none;color:#b42318;font-size:13px;margin-bottom:10px"></div>
  <form id="alqGateForm">
    <label style="display:block;font-size:12px;color:#51607a;margin-bottom:2px">Correo</label>
    <input id="alqGateEmail" type="email" autocomplete="username" required style="margin-bottom:10px">
    <label style="display:block;font-size:12px;color:#51607a;margin-bottom:2px">Contraseña</label>
    <input id="alqGatePass" type="password" autocomplete="current-password" required>
    <button id="alqGateBtn" style="width:100%;margin-top:14px">Ingresar</button>
  </form>
  <a href="admin.html" style="font-size:12px;color:#51607a;display:block;text-align:center;margin-top:12px">← Volver al panel</a>
 </div>
</div>
