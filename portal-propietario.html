<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Propietario | BIENENHAUS</title>
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
  <link rel="apple-touch-icon" href="assets/images/pwa-512x512.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://*.supabase.co https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.cloudinary.com https://images.unsplash.com https://*.supabase.co https://res.cloudinary.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://static.cloudflareinsights.com https://api.cloudflareinsights.com https://cdn.jsdelivr.net; frame-src 'none';" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg-dark: #05070A;
      --bg-card: rgba(14,19,26,0.85);
      --bg-card-hover: rgba(20,27,38,0.95);
      --border: rgba(255,255,255,0.08);
      --border-accent: rgba(31,200,195,0.35);
      --gold: #1FC8C3;
      --gold-dim: rgba(31,200,195,0.16);
      --green: #10B981;
      --green-dim: rgba(16,185,129,0.12);
      --red: #FF4757;
      --red-dim: rgba(255,71,87,0.12);
      --blue: #3B82F6;
      --blue-dim: rgba(59,130,246,0.12);
      --orange: #F59E0B;
      --orange-dim: rgba(245,158,11,0.12);
      --purple: #a78bfa;
      --purple-dim: rgba(167,139,250,0.14);
      --text: #F8FAFC;
      --text-dim: #CBD5E1;
      --text-muted: #8E9BAE;
      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 16px 40px rgba(0,0,0,0.4);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(31,200,195,0.06), transparent 60%),
        radial-gradient(1000px 500px at 10% 10%, rgba(139,92,246,0.05), transparent 60%),
        var(--bg-dark);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .portal-header {
      background: linear-gradient(135deg, rgba(5,7,10,0.9), rgba(14,19,26,0.92)), url('assets/images/hero-bg.webp');
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--border-accent);
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    .portal-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .portal-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .portal-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border-accent);
      box-shadow: 0 0 0 1px var(--glow-soft), 0 0 20px rgba(31,200,195,0.25);
    }
    .portal-logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .portal-user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .portal-user-badge .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-weight: 600;
      font-size: 13px;
    }

    /* ── ERROR STATES ── */
    .portal-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 40px 24px;
    }
    .portal-error-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--red-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .portal-error-icon i { font-size: 32px; color: var(--red); }
    .portal-error h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      margin-bottom: 8px;
      color: var(--text);
    }
    .portal-error p {
      color: var(--text-dim);
      font-size: 14px;
      max-width: 400px;
    }

    /* ── TABS ── */
    .tabs-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px 0;
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 12px 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .tab-btn .badge {
      font-size: 11px;
      background: var(--gold-dim);
      color: var(--gold);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: 600;
    }

    /* ── MAIN ── */
    .portal-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── GRID ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .stat-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px var(--glow-soft), 0 8px 30px rgba(31,200,195,0.10);
    }
    .stat-card .label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-card .label i { font-size: 12px; }
    .stat-card .value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-card .value.gold { color: var(--gold); }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.blue { color: var(--blue); }
    .stat-card .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── SECTION ── */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title i {
      font-size: 16px;
      color: var(--gold);
    }

    /* ── NEXT VISIT ── */
    .next-visit {
      background: linear-gradient(135deg, rgba(31,200,195,0.10), rgba(31,200,195,0.03));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .next-visit-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .next-visit-icon i { font-size: 22px; color: var(--gold); }
    .next-visit-info h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .next-visit-info p {
      font-size: 13px;
      color: var(--text-dim);
    }
    .next-visit-info .date {
      font-weight: 600;
      color: var(--gold);
    }

    /* ── BROKER ── */
    .broker-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: border-color 0.2s;
    }
    .broker-card:hover { border-color: var(--border-accent); }
    .broker-photo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-accent);
      flex-shrink: 0;
      background: var(--bg-card-hover);
    }
    .broker-photo-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 20px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .broker-info h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .broker-info p {
      font-size: 13px;
      color: var(--text-dim);
    }
    .broker-info .broker-role {
      font-size: 11px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .broker-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .broker-actions a {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.2s;
      font-size: 14px;
    }
    .broker-actions a:hover {
      background: var(--gold-dim);
      border-color: var(--border-accent);
      color: var(--gold);
    }

    /* ── ACTIVITY FEED ── */
    .activity-list {
      list-style: none;
    }
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-dot.publicacion { background: var(--green); }
    .activity-dot.ml_publicacion { background: var(--blue); }
    .activity-dot.ml_sync { background: var(--purple); }
    .activity-dot.consulta { background: var(--orange); }
    .activity-dot.visita_agendada { background: var(--gold); }
    .activity-dot.visita_completada { background: var(--green); }
    .activity-text {
      font-size: 13px;
      color: var(--text);
      flex: 1;
    }
    .activity-time {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── LEADS BY SOURCE ── */
    .source-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .source-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .source-bar .source-name {
      font-size: 12px;
      color: var(--text-dim);
      width: 100px;
      text-transform: capitalize;
      flex-shrink: 0;
    }
    .source-bar .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.04);
      border-radius: 3px;
      overflow: hidden;
    }
    .source-bar .bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    .source-bar .bar-count {
      font-size: 12px;
      color: var(--text-dim);
      width: 30px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── WELCOME / RESUMEN ── */
    .welcome-header {
      background: linear-gradient(135deg, rgba(31,200,195,0.12), rgba(31,200,195,0.04));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    .welcome-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .welcome-greet {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .welcome-greet .wg-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--gold-dim);
      border: 1px solid var(--border-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .welcome-greet .wg-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
    }
    .welcome-greet .wg-text .wg-date {
      font-size: 12px;
      color: var(--text-muted);
    }
    .welcome-portfolio-summary { margin-top: 4px; }

    /* Reutilizamos .prop-summary para la barra de cartera del inicio */
    .welcome-portfolio-summary .prop-summary { margin-bottom: 0; }

    /* ── QUICK ACTIONS ── */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }
    .quick-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .quick-action i { font-size: 13px; color: var(--gold); }
    .quick-action:hover { border-color: var(--border-accent); background: var(--bg-card-hover); }
    .quick-action.wa i { color: var(--green); }
    .quick-action.primary {
      background: var(--gold-dim);
      border-color: var(--border-accent);
      color: var(--gold);
    }
    .quick-action.primary:hover { background: var(--gold-dim); }

    /* ── EXCLUSIVIDAD DESTACADA EN INICIO ── */
    .excl-inicio-card {
      background: linear-gradient(135deg, rgba(139,92,246,0.12), rgba(31,200,195,0.03));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .excl-inicio-card.vencida { background: linear-gradient(135deg, rgba(255,71,87,0.10), rgba(31,200,195,0.03)); border-color: rgba(255,71,87,0.3); }
    .excl-inicio-card .ei-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--gold-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 18px;
      flex-shrink: 0;
    }
    .excl-inicio-card.vencida .ei-icon { background: var(--red-dim); color: var(--red); }
    .excl-inicio-card .ei-body { flex: 1; min-width: 200px; }
    .excl-inicio-card .ei-body h4 {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .excl-inicio-card .ei-body p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 3px;
    }
    .excl-inicio-card .ei-cta {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      border: 1px solid var(--border-accent);
      border-radius: 8px;
      padding: 8px 14px;
      background: var(--gold-dim);
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .excl-inicio-card .ei-cta:hover { background: var(--gold-dim); border-color: var(--gold); }
    .excl-inicio-card.vencida .ei-cta { color: var(--red); background: var(--red-dim); }
    .excl-inicio-card.vencida .ei-cta:hover { border-color: var(--red); }

    /* ── EMPTY STATES (inicio) ── */
    .inicio-empty {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px dashed var(--border-accent);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      color: var(--text-dim);
      font-size: 13px;
      backdrop-filter: blur(12px);
    }
    .inicio-empty i { font-size: 16px; color: var(--text-muted); }
    .inicio-empty.centered { justify-content: center; }

    /* ── PROPERTY CARD ── */
    .prop-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .prop-card:hover {
      border-color: var(--border-accent);
      box-shadow: 0 0 0 1px var(--glow-soft), 0 10px 34px rgba(31,200,195,0.10);
    }
    .prop-card-header {
      display: flex;
      align-items: stretch;
      cursor: pointer;
      user-select: none;
    }
    .prop-card-thumb {
      width: 120px;
      height: 100px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-card-hover);
    }
    .prop-card-body {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .prop-card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .prop-card-meta {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      align-items: center;
    }
    .prop-card-meta i { font-size: 11px; margin-right: 2px; }
    .prop-card-badges {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .prop-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .prop-badge.oportunidad { background: var(--green-dim); color: var(--green); }
    .prop-badge.retasada { background: var(--orange-dim); color: var(--orange); }
    .prop-badge.destacada { background: var(--gold-dim); color: var(--gold); }
    .prop-badge.ml { background: var(--blue-dim); color: var(--blue); }
    .prop-badge-exclusive { background: var(--gold-dim); color: var(--gold); }
    .prop-card-expand {
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .prop-card.expanded .prop-card-expand { transform: rotate(180deg); }
    .prop-card-detail {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }
    .prop-card.expanded .prop-card-detail { display: block; }
    .prop-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding-top: 14px;
    }
    .prop-detail-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .prop-detail-item .val {
      font-size: 14px;
      font-weight: 600;
    }
    .prop-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .prop-gallery img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .prop-gallery img:hover { opacity: 0.85; }
    .prop-stats-row {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .prop-stat {
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .prop-stat i { font-size: 11px; }
    .prop-stat .count { font-weight: 600; color: var(--text); }

    /* Timeline */
    .prop-timeline {
      margin-top: 12px;
      border-left: 2px solid var(--border);
      padding-left: 14px;
    }
    .prop-timeline-item {
      position: relative;
      padding-bottom: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .prop-timeline-item::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
    }
    .prop-timeline-item .tl-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    /* ── EXCLUSIVIDAD ── */
    .excl-banner {
      background: linear-gradient(135deg, rgba(31,200,195,0.08), rgba(31,200,195,0.02));
      border: 1px solid rgba(31,200,195,0.2);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    .excl-banner h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .excl-banner h3 i { color: var(--gold); }
    .excl-banner p { font-size: 13px; color: var(--text-dim); }
    .excl-countdown {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .excl-countdown-item {
      text-align: center;
      background: rgba(31,200,195,0.10);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      min-width: 72px;
    }
    .excl-countdown-item .num {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
    }
    .excl-countdown-item .unit {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .excl-progress-wrap {
      margin-top: 20px;
    }
    .excl-progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .excl-progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.04);
      border-radius: 4px;
      overflow: hidden;
    }
    .excl-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #159A95, var(--gold));
      border-radius: 4px;
      transition: width 0.8s ease;
    }
    .excl-benefits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .excl-benefit {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .excl-benefit i {
      font-size: 18px;
      color: var(--gold);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .excl-benefit h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .excl-benefit p { font-size: 12px; color: var(--text-dim); }
    .excl-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 24px;
    }
    .excl-stats-grid .stat-card { text-align: center; }
    .whatsapp-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 12px 24px;
      background: #25d366;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .whatsapp-cta:hover { background: #1da851; }

    /* ── EXCL ESTADOS ── */
    .excl-state-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-left: 10px;
      vertical-align: middle;
    }
    .excl-state-badge.activa { background: var(--green-dim); color: var(--green); }
    .excl-state-badge.por-vencer { background: var(--orange-dim); color: var(--orange); }
    .excl-state-badge.vencida { background: rgba(239,68,68,0.15); color: #ef4444; }
    .excl-banner.excl-state-por-vencer,
    .excl-banner.excl-state-vencida {
      background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.02));
      border-color: rgba(239,68,68,0.25);
    }
    .excl-countdown.excl-warn .excl-countdown-item {
      background: rgba(239,68,68,0.1);
    }
    .excl-countdown.excl-warn .num { color: #ef4444; }

    /* ── EXCL PROGRESS FASE ── */
    .excl-progress-fill.phase-good { background: linear-gradient(90deg, var(--green), var(--gold)); }
    .excl-progress-fill.phase-warn { background: linear-gradient(90deg, var(--orange), var(--gold)); }
    .excl-progress-fill.phase-danger { background: linear-gradient(90deg, #ef4444, var(--orange)); }
    .excl-progress-days {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: right;
    }

    /* ── EXCL CONTRATO ── */
    .excl-contract {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }
    .excl-contract-bits {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .excl-contract-pill {
      font-size: 12px;
      color: var(--text);
      background: rgba(31,200,195,0.10);
      border: 1px solid rgba(31,200,195,0.25);
      border-radius: 6px;
      padding: 5px 12px;
    }
    .excl-contract-notes {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-dim);
      background: var(--bg-card);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      padding: 10px 14px;
      line-height: 1.5;
    }

    /* ── EXCL COMPARATIVA ── */
    .excl-deltas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .excl-delta {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .excl-delta-top {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .excl-delta-top i { color: var(--gold); font-size: 13px; }
    .excl-delta-num {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin: 8px 0 4px;
    }
    .excl-delta-foot { font-size: 12px; font-weight: 600; }
    .excl-delta-foot.up { color: var(--green); }
    .excl-delta-foot.down { color: #ef4444; }
    .excl-delta-foot.flat { color: var(--text-muted); }
    .excl-delta-prev {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── EXCL SHARE (portfolio) ── */
    .excl-share {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .excl-share-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .excl-share-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
    }
    .excl-share-label { font-size: 12px; color: var(--text-dim); line-height: 1.4; }

    /* ── EXCL TIMELINE ── */
    .excl-timeline {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .excl-timeline-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .excl-timeline-item > i {
      color: var(--gold);
      font-size: 13px;
      margin-top: 3px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .excl-timeline-body {
      flex: 1;
      border-left: 2px solid var(--border);
      padding-left: 14px;
      padding-bottom: 2px;
    }
    .excl-timeline-text { font-size: 13px; color: var(--text); line-height: 1.4; }
    .excl-timeline-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ── RENOVACIÓN ── */
    .excl-renew-cta { background: #b45309; }
    .excl-renew-cta:hover { background: #92400e; }
    .excl-renew-note {
      font-size: 13px;
      color: var(--orange);
      background: var(--orange-dim);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-top: 20px;
    }

    /* ── PROPIEDADES: RESUMEN ── */
    .prop-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .prop-summary-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: border-color 0.2s;
    }
    .prop-summary-item:hover { border-color: var(--border-accent); }
    .prop-summary-item i {
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .prop-summary-item .ps-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }
    .prop-summary-item .ps-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ── FILTROS ── */
    .prop-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .prop-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .prop-filter i { font-size: 11px; }
    .prop-filter:hover { border-color: var(--border-accent); color: var(--text); }
    .prop-filter.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── CABECERA TARJETA ── */
    .prop-type-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .prop-card-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }
    .prop-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 5px;
    }
    .prop-status-badge.live { background: var(--green-dim); color: var(--green); }
    .prop-status-badge.draft { background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .prop-status-badge.sold { background: var(--blue-dim); color: var(--blue); }
    .prop-next-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      background: var(--gold-dim);
      border-radius: 5px;
      padding: 3px 9px;
    }
    .prop-price {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      font-weight: 700;
      color: var(--gold);
    }
    .prop-price-sec {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* ── DETALLE ── */
    .prop-desc {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.55;
    }
    .prop-desc i { color: var(--gold); margin-top: 3px; flex-shrink: 0; }
    .prop-video {
      margin-top: 14px;
    }
    .prop-video a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      text-decoration: none;
    }
    .prop-video a:hover { text-decoration: underline; }
    .prop-stat-sub {
      display: block;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 400;
    }

    /* Timeline nuevo */
    .prop-timeline-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .prop-timeline-item > i {
      color: var(--gold);
      font-size: 12px;
      margin-top: 3px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .prop-timeline-body {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      color: var(--text);
    }
    .prop-timeline-body .tl-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Galería ampliada */
    .prop-gallery { margin-top: 14px; }
    .prop-gallery-more {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      background: var(--bg-card-hover);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .prop-gallery-more:hover { background: var(--border); color: var(--text); }
    .prop-lightbox-data { display: none; }

    /* ── LIGHTBOX ── */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
    }
    .lightbox-img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 8px;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }
    .lightbox-nav.prev { left: -56px; }
    .lightbox-nav.next { right: -56px; }
    .lightbox-count {
      text-align: center;
      color: #fff;
      font-size: 13px;
      margin-top: 10px;
    }

    /* ── NO DATA ── */
    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-dim);
    }
    .empty-msg i { font-size: 40px; margin-bottom: 12px; color: var(--text-muted); }
    .empty-msg h3 { font-size: 16px; color: var(--text); margin-bottom: 4px; }
    .empty-msg p { font-size: 13px; }

    /* ── LOADING ── */
    .portal-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
    }
    .activity-card {
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .portal-loading p {
      font-size: 14px;
      color: var(--text-dim);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .tabs-bar { padding: 12px 16px 0; overflow-x: auto; }
      .tab-btn { padding: 10px 14px; font-size: 13px; white-space: nowrap; }
      .portal-main { padding: 16px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat-card { padding: 12px; }
      .stat-card .value { font-size: 20px; }
      .prop-card-thumb { width: 90px; height: 80px; }
      .next-visit { flex-direction: column; text-align: center; }
      .broker-card { flex-direction: column; text-align: center; }
      .broker-actions { margin-left: 0; }
      .excl-countdown { justify-content: center; }
      .excl-stats-grid { grid-template-columns: 1fr; }
      .excl-deltas { grid-template-columns: 1fr; }
      .excl-share { grid-template-columns: 1fr; }
      .excl-state-badge { margin-left: 0; margin-top: 8px; }
      .portal-user-badge span { display: none; }
      .welcome-header { padding: 18px 16px; }
      .welcome-greet .wg-text h2 { font-size: 18px; }
      .welcome-top { flex-direction: column; align-items: flex-start; }
      .quick-action { width: 100%; justify-content: center; }
      .excl-inicio-card { flex-direction: column; align-items: flex-start; }
      .excl-inicio-card .ei-cta { align-self: stretch; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="portal-header">
    <div class="portal-header-inner">
      <a href="/" class="portal-logo">
        <img src="assets/images/pwa-512x512.png" alt="BIENENHAUS" class="portal-logo-icon">
        <span class="portal-logo-text">BIENENHAUS</span>
      </a>
      <div class="portal-user-badge" id="userBadge" style="display:none;">
        <div class="avatar" id="userAvatar"></div>
        <span id="userName"></span>
      </div>
    </div>
  </header>

  <!-- LOADING -->
  <div class="portal-loading" id="loadingState">
    <div class="spinner"></div>
    <p>Cargando tu portal...</p>
  </div>

  <!-- ERROR -->
  <div class="portal-error" id="errorState" style="display:none;">
    <div class="portal-error-icon"><i class="fas fa-exclamation-triangle"></i></div>
    <h2 id="errorTitle">Link inválido</h2>
    <p id="errorMsg">El enlace que utilizaste no es válido o expiró. Pedí a tu asesor un nuevo link de acceso.</p>
  </div>

  <!-- CONTENT -->
  <div id="contentState" style="display:none;">
    <nav class="tabs-bar">
      <button class="tab-btn active" data-tab="inicio"><i class="fas fa-home"></i> Inicio</button>
      <button class="tab-btn" data-tab="propiedades"><i class="fas fa-building"></i> Mis Propiedades <span class="badge" id="propCount"></span></button>
      <button class="tab-btn" data-tab="exclusividad"><i class="fas fa-handshake"></i> Exclusividad</button>
    </nav>

    <main class="portal-main">
      <!-- ─── INICIO ─── -->
      <div class="tab-panel active" id="panel-inicio">
        <div id="welcomeSlot"></div>

        <div id="quickActionsSlot" style="margin-bottom:24px;"></div>

        <div id="nextVisitSlot"></div>
        <div id="brokerSlot"></div>
        <div id="exclInicioSlot"></div>

        <div class="section-title"><i class="fas fa-chart-pie"></i> Resumen general</div>
        <div class="stat-grid" id="statGrid"></div>

        <div id="sourcesSlot" style="margin-bottom:24px;"></div>

        <div class="section-title"><i class="fas fa-clock"></i> Novedades recientes</div>
        <div class="activity-card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;">
          <ul class="activity-list" id="activityList"></ul>
        </div>
      </div>

      <!-- ─── PROPIEDADES ─── -->
      <div class="tab-panel" id="panel-propiedades">
        <div id="propList"></div>
      </div>

      <!-- ─── EXCLUSIVIDAD ─── -->
      <div class="tab-panel" id="panel-exclusividad">
        <div id="exclContent"></div>
      </div>
    </main>
  </div>

  <script src="assets/js/config.js?v=5"></script>
  <script src="assets/js/utils.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/pages/portal-propietario-page.js"></script>
</body>
</html>
