<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QR de llegada | BIENENHAUS</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://api.qrserver.com https://*.supabase.co; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co;" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; padding: 40px 20px; }
    .card { max-width: 460px; width: 100%; text-align: center; border: 3px solid #1fc8c3; border-radius: 18px; padding: 34px 28px; }
    .brand { font-family: 'Playfair Display', serif; font-size: 24px; color: #0a2e2c; letter-spacing: 2px; }
    .brand span { color: #1fc8c3; }
    .tit { font-size: 15px; color: #444; margin: 18px 0 6px; }
    .prop { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 4px; }
    .dir { font-size: 13px; color: #666; margin-bottom: 20px; }
    .qr { width: 240px; height: 240px; margin: 0 auto 16px; display: block; }
    .cta { font-size: 14px; font-weight: 600; color: #0a2e2c; }
    .cta small { display: block; font-weight: 400; color: #777; margin-top: 6px; font-size: 11.5px; }
    .print-btn { margin-top: 22px; background: #1fc8c3; color: #04211f; border: none; padding: 12px 26px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
    @media print { .print-btn { display: none; } body { padding: 0; } .card { border-radius: 0; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">BIENENHAUS <span>PROPIEDADES</span></div>
    <p class="tit">Visitando esta propiedad</p>
    <p class="prop" id="propTitle">Cargando…</p>
    <p class="dir" id="propDir"></p>
    <img class="qr" id="qrImg" alt="QR de llegada" />
    <p class="cta">Escaneá el código al llegar<small>Registra automáticamente el inicio de la visita.</small></p>
    <button class="print-btn" onclick="window.print()">Imprimir cartel</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1"></script>
  <script>
    (async function () {
      const token = new URLSearchParams(location.search).get('token');
      const img = document.getElementById('qrImg');
      if (!token) { document.getElementById('propTitle').textContent = 'Enlace inválido'; img.style.display = 'none'; return; }
      const target = location.origin + '/confirmar-visita.html?token=' + encodeURIComponent(token) + '&mode=checkin';
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=8&data=' + encodeURIComponent(target);
      try {
        const sb = supabase.createClient(window.BH_CONFIG.SUPABASE_URL, window.BH_CONFIG.SUPABASE_ANON_KEY);
        const { data } = await sb.rpc('get_visit_by_token', { p_token: token });
        if (data) {
          document.getElementById('propTitle').textContent = (data.property && data.property.title) || 'Visita programada';
          document.getElementById('propDir').textContent = (data.property && data.property.address) || '';
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
