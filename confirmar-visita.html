<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Confirmar Visita | BIENENHAUS</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://*.supabase.co https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.cloudinary.com https://images.unsplash.com https://*.supabase.co https://res.cloudinary.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://static.cloudflareinsights.com https://api.cloudflareinsights.com https://cdn.jsdelivr.net; frame-src 'self';" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/landing.css?v=126">
  <style>
    .confirm-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%); }
    .confirm-card { width: 100%; max-width: 480px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 40px; backdrop-filter: blur(20px); text-align: center; }
    .confirm-icon { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 32px; }
    .confirm-icon.success { background: rgba(0,200,120,0.2); color: #00c878; }
    .confirm-icon.warning { background: rgba(255,184,0,0.2); color: #FFB800; }
    .confirm-icon.danger { background: rgba(239,68,68,0.2); color: #ef4444; }
    .confirm-icon.pending { background: rgba(31,200,195,0.2); color: #1fc8c3; }
    h1 { font-family: 'Playfair Display', serif; font-size: 28px; color: #fff; margin-bottom: 8px; }
    .confirm-subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }
    .visit-details { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 20px; margin-bottom: 24px; text-align: left; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-dim); font-size: 13px; }
    .detail-value { color: #fff; font-weight: 500; font-size: 14px; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-confirm { background: linear-gradient(135deg, #00c878 0%, #00a664 100%); color: #000; }
    .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,200,120,0.4); }
    .btn-cancel { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .btn-cancel:hover { background: rgba(239,68,68,0.25); }
    .btn-wa { background: rgba(37,211,102,0.15); color: #25d366; border: 1px solid rgba(37,211,102,0.3); }
    .btn-wa:hover { background: rgba(37,211,102,0.25); }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
    .status-pendiente { background: rgba(255,184,0,0.2); color: #FFB800; }
    .status-confirmada { background: rgba(0,200,120,0.2); color: #00c878; }
    .status-completada { background: rgba(31,200,195,0.2); color: #1fc8c3; }
    .status-cancelada { background: rgba(239,68,68,0.2); color: #ef4444; }
    .error-state { color: #ef4444; }
    .loading { color: var(--text-dim); }

    /* ── Encuesta (HOJA DE VISITA digital) ── */
    .confirm-card.survey-mode { max-width: 560px; text-align: left; }
    .confirm-card.survey-mode .confirm-icon { margin-bottom: 16px; }
    .survey-welcome { color: var(--text-muted); font-size: 14px; margin-bottom: 22px; text-align: center; line-height: 1.5; }
    .survey-q { margin-bottom: 16px; }
    .sq-label { display: block; font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 8px; }
    .sq-label .sq-num { color: var(--text-dim); font-weight: 500; }
    .sq-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .sq-pill { flex: 1 1 0; min-width: 30px; max-width: 46px; padding: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; text-align: center; font-family: inherit; }
    .sq-pill:hover { border-color: #1fc8c3; color: #fff; }
    .sq-pill.is-active { background: linear-gradient(135deg, #1fc8c3 0%, #17a398 100%); color: #04211f; border-color: transparent; }
    .sq-pill.pill-si.is-active { background: linear-gradient(135deg, #00c878 0%, #00a664 100%); color: #03210f; }
    .sq-pill.pill-no.is-active { background: linear-gradient(135deg, #ef4444 0%, #c53030 100%); color: #fff; }
    .sq-pill.pill-wide { max-width: none; flex: 1 1 120px; padding: 10px 0; font-size: 13px; }
    .sq-text { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 58px; }
    .sq-text:focus { outline: none; border-color: #1fc8c3; }
    .sq-autosave { font-size: 11px; color: var(--text-dim); min-height: 16px; text-align: right; margin-top: 4px; }
    #btnSaveSurvey { display: block; width: 100%; margin-top: 14px; padding: 14px 32px; font-size: 15px; }
    .t-score-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0; }
    .t-score { background: rgba(31,200,195,0.08); border: 1px solid rgba(31,200,195,0.25); border-radius: 10px; padding: 8px 12px; text-align: center; min-width: 64px; }
    .t-score .ts-v { font-size: 18px; font-weight: 700; color: #1fc8c3; }
    .t-score .ts-l { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
    @media (max-width: 420px) { .sq-pill { min-width: 26px; padding: 7px 0; font-size: 11px; } }
  </style>
</head>
<body>
  <div class="confirm-page">
    <div class="confirm-card" id="confirmCard">
      <div class="confirm-icon pending" id="confirmIcon"><i class="fas fa-clock"></i></div>
      <h1 id="confirmTitle">Cargando...</h1>
      <p class="confirm-subtitle" id="confirmSubtitle">Verificando tu visita...</p>
      <span class="status-badge status-pendiente" id="statusBadge">Pendiente</span>
      
      <div class="visit-details" id="visitDetails" style="display:none;">
        <div class="detail-row">
          <span class="detail-label">Cliente</span>
          <span class="detail-value" id="detailClient">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Fecha y Hora</span>
          <span class="detail-value" id="detailDate">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Duración</span>
          <span class="detail-value" id="detailDuration">—</span>
        </div>
        <div class="detail-row" id="detailPropertyRow" style="display:none;">
          <span class="detail-label">Propiedad</span>
          <span class="detail-value" id="detailProperty">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Broker</span>
          <span class="detail-value" id="detailBroker">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Notas</span>
          <span class="detail-value" id="detailNotes">—</span>
        </div>
      </div>

      <div class="btn-group" id="actionButtons" style="display:none;">
        <button class="btn-luxury-action btn-confirm" id="btnConfirm" style="padding:14px 32px; font-size:15px;">
          <i class="fas fa-check"></i> Confirmar Visita
        </button>
        <button class="btn-luxury-action btn-cancel" id="btnCancel" style="padding:14px 32px; font-size:15px;">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <a class="btn-luxury-action btn-wa" id="btnWhatsApp" target="_blank" style="padding:14px 32px; font-size:15px; text-decoration:none; display:inline-flex; align-items:center; gap:8px;">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
      </div>

      <div id="surveySection" style="display:none;"></div>
      <div id="surveyThanks" style="display:none;"></div>

      <p style="margin-top:24px; font-size:12px; color:var(--text-dim);">
        ¿No eres tú? Ignora este mensaje.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1"></script>
  <script src="assets/js/pages/confirmar-visita-page.js?v=4"></script>
  <style>
    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  </style>
</body>
</html>
