<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>harness alquileres-comps</title>
</head>
<body>
<!-- El core en carga sólo toca document.querySelector('header') (hh) -->
<header style="height:40px"></header>

<!-- Core REAL del módulo (sin app.js: no hace falta cliente Supabase) -->
<script src="../../assets/js/alquileres-core.js"></script>

<script>
/* Override de la capa UI/archivo: las funciones de comprobantes no deben tocar
   DOM ni descargar archivos en el harness. Function declarations: la última
   gana (patrón del app). */
function render() {}
function tot() {}
function est() {}
function guardarArchivo() {}
function restaurarAdj() {}
window.confirm = (t) => { (window.__CONFIRMS = window.__CONFIRMS || []).push(String(t)); return true; };
window.alert = (t) => { (window.__ALERTS = window.__ALERTS || []).push(String(t)); };

/* Flujo behavioral de comprobantes de pago (pc:<pid>:<mes>:<uid>):
   subir (PDF + imagen) → read-back de IndexedDB → visor (img/iframe) → quitar.
   Corre con el SEED real del core. */
window.__RUN = async function () {
  const out = {};
  try {
    S = JSON.parse(JSON.stringify(SEED));
    bhInitS(S);
    S.m = 9; S.y = 2026; // Octubre
    const p = S.props[0];
    S.sel = p.id;

    const fPdf = new File(['PDF-FAKE-CONTENT'], 'recibo.pdf', { type: 'application/pdf' });
    const fImg = new File([new Uint8Array([137, 80, 78, 71, 13, 10])], 'foto.png', { type: 'image/png' });

    /* 1) subir los dos comprobantes */
    await subirComps([fPdf, fImg]);
    const mes = '2026-10';
    const list = (p.comprobantes || {})[mes] || [];
    out.cantTrasSubir = list.length; // 2
    out.metadatos = list.map(c => ({ arch: c.arch, tipo: c.tipo }));
    out.clavesConPrefijo = list.every(c => typeof c.k === 'string' && c.k.indexOf('pc:' + p.id + ':' + mes + ':') === 0);

    /* 2) read-back REAL de IndexedDB (ida y vuelta de archivos) */
    const b1 = await idbDo('get', list[0].k);
    const b2 = await idbDo('get', list[1].k);
    out.pdfType = b1 ? b1.type : null;      // application/pdf
    out.pdfSize = b1 ? b1.size : 0;         // > 0
    out.imgType = b2 ? b2.type : null;      // image/png

    /* 3) visor: imagen → CV.img=true, pdf → CV.img=false */
    await verComp(1);
    out.cvImg = CV ? { key: CV.key === list[1].k, img: CV.img, tieneUrl: !!CV.url } : null;
    await verComp(0);
    out.cvPdf = CV ? { key: CV.key === list[0].k, img: CV.img } : null;

    /* 4) toggle off (Ver de nuevo = Ocultar) */
    await verComp(0);
    out.cvCerrado = CV === null;

    /* 5) scoping por mes: FM apunta a otro mes → el comprobante va a ESE mes */
    FM = '2026-09';
    await subirComps([new File(['X'], 'recibo-septiembre.png', { type: 'image/png' })]);
    out.sep = ((p.comprobantes || {})['2026-09'] || []).map(c => c.arch);
    FM = null;

    /* 6) quitar: confirm + idb del + splice */
    const k1 = list[0].k;
    await quitarComp(0);
    out.cantTrasQuitar = list.length; // 1
    out.confirmLlamado = (window.__CONFIRMS || []).some(t => t.indexOf('comprobante') >= 0);
    out.idbBorrado = !(await idbDo('get', k1)); // IndexedDB get devuelve undefined para claves borradas
    out.quedo = list[0] ? list[0].arch : null; // foto.png

    /* 7) render real de la ficha: el template de la card NO debe dejar basura
       textual (bug real: un '})()}' sin cerrar se imprimía en pantalla). */
    const html = ficha();
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    out.sinBasura = html.indexOf('})()}') < 0;
    out.inputPc = tmp.querySelectorAll('#pc').length;      // 1 (input único)
    out.botonSubir = Array.prototype.some.call(tmp.querySelectorAll('button'), b => b.textContent.indexOf('Subir comprobante') >= 0);
    out.duoCards = tmp.querySelectorAll('.duo > .card').length; // 2 (facturas | comprobantes)
    out.tituloComps = !!tmp.querySelector('.duo .card h3:nth-child(1)') && (tmp.querySelectorAll('.duo .card h3')[1] || {}).textContent === 'Comprobantes de pago';

    /* 8) REGRESIÓN 19/11/2026 (pedido del empleador): el flujo REAL del input
       —FileList VIVO + el value='' del onchange— tiene que guardar TODOS los
       archivos elegidos en una sola operación. Antes se guardaba sólo el
       PRIMERO: el value='' vaciaba el FileList mientras el for..of estaba
       suspendido en el await de IndexedDB. Este paso usa el input real con un
       DataTransfer (NO un array) → es el flujo que dispara el bug.
       Se hace en un mes aparte (FM=2026-11) para no mezclar con los pasos
       anteriores. */
    const cont = document.createElement('div');
    cont.innerHTML = ficha();
    document.body.appendChild(cont);
    const inp = cont.querySelector('#pc');
    out.inputMultiple = !!(inp && inp.multiple);
    FM = '2026-11';
    const dt = new DataTransfer();
    dt.items.add(new File(['A'], 'lote-1.pdf', { type: 'application/pdf' }));
    dt.items.add(new File(['B'], 'lote-2.pdf', { type: 'application/pdf' }));
    dt.items.add(new File(['C'], 'lote-3.png', { type: 'image/png' }));
    inp.files = dt.files;
    out.filesElegidos = inp.files.length;
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    await new Promise(r => setTimeout(r, 600));
    const lote = (p.comprobantes || {})['2026-11'] || [];
    out.guardadosEnUnaOperacion = lote.length;            // 3 (NO 1)
    out.nombresEnUnaOperacion = lote.map(c => c.arch);
    /* read-back real de los 3 en IndexedDB (no sólo la metadata) */
    const r1 = lote[0] ? await idbDo('get', lote[0].k) : null;
    const r3 = lote[2] ? await idbDo('get', lote[2].k) : null;
    out.idaYVuelta = !!(r1 && r3 && r1.size > 0 && r3.size > 0);
    FM = null;

    out.alerts = window.__ALERTS || [];
    out.ok = true;
  } catch (e) {
    out.err = (e && e.message) || String(e);
  }
  return out;
};
</script>
</body>
</html>
