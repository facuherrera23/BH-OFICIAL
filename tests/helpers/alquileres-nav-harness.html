<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>harness alquileres-nav</title>
</head>
<body>
<!-- El core en carga sólo toca document.querySelector('header') (hh) -->
<header style="height:40px"></header>

<!-- Core REAL del módulo (sin app.js: no hace falta cliente Supabase) -->
<script src="../../assets/js/alquileres-core.js"></script>

<script>
/* Override de la capa UI/archivo: en navegación el core no debe tocar DOM ni
   descargar archivos. Function declarations: la última gana (patrón del app). */
function render() {}
function tot() {}
function est() {}
function guardarArchivo() {}
function restaurarAdj() {}
window.confirm = (t) => { (window.__CONFIRMS = window.__CONFIRMS || []).push(String(t)); return true; };

/* Flujo behavioral del incidente del 17/11: Octubre → Noviembre → atrás → re-cierre.
   Corre con el SEED real del core (11 props, m=9 = Octubre 2026). */
window.__RUN = function () {
  const out = {};
  try {
    S = JSON.parse(JSON.stringify(SEED));
    bhInitS(S);
    mezclarHist();
    S.m = 9; S.y = 2026; // Octubre (SEED ya es m=9, explícito por claridad)

    /* dato único de Octubre: monto de agua + extra en 2-0 */
    const p0 = S.props.find(x => x.cod == '2-0');
    p0.sv.agua.monto = 42424.24;
    p0.ex.push({ c: 'EXPENSAS PRUEBA', m: 7777, a: 'inq' });
    const propsOct = JSON.stringify(S.props);

    /* 1) adelante: cierra Octubre → Noviembre derivado en blanco */
    mesMas(1);
    out.mTrasAdelante = S.m; // 10 = Noviembre
    const nTrasPrimerCierre = (window.__CONFIRMS || []).length;
    out.capturadoOct = !!(S.live && S.live['2026-10'] && JSON.stringify(S.live['2026-10']) === propsOct);
    out.histOct = !!(S.hist && S.hist['2026-10'] && S.hist['2026-10'].length > 0);
    out.histOct1 = JSON.stringify(S.hist['2026-10']);
    const pNov0 = S.props.find(x => x.cod == '2-0');
    out.derivNovBlanca = pNov0.sv.agua.monto === 0;               // servicios no-muni a 0
    out.exLimpioNov = S.props.find(x => x.cod == '4-0').ex.length === 0; // extras blanqueados
    out.muniConserva = S.props.find(x => x.cod == '3-0').sv.muni.monto === 6318; // muni conserva
    out.luzKaKc = pNov0.sv.luz.ka === pNov0.sv.luz.kc;             // luz lleva ka=kc

    /* 2) trabajamos Noviembre y volvemos atrás */
    pNov0.sv.agua.monto = 55555.55;
    pNov0.ex.push({ c: 'GAS NOVIEMBRE', m: 3210, a: 'inq' });
    const propsNov = JSON.stringify(S.props);

    mesMas(-1);
    out.mTrasAtras = S.m; // 9 = Octubre
    out.capturadoNov = !!(S.live && S.live['2026-11'] && JSON.stringify(S.live['2026-11']) === propsNov);
    out.octRestaurado = JSON.stringify(S.props) === propsOct; // Octubre EXACTO (copia viva)

    /* 3) re-cierre de Octubre SIN cambios → NO avisa y NO reescribe el historial
       (caso real del empleador: navegó y volvió a cerrar; el historial
       archivado se pisaba con una reconstrucción más pobre) */
    mesMas(1);
    out.mTrasReAdelante = S.m; // 10
    const pNov2 = S.props.find(x => x.cod == '2-0');
    out.novRestaurado = JSON.stringify(S.props) === propsNov
      && pNov2.sv.agua.monto === 55555.55
      && pNov2.ex.length === 1 && pNov2.ex[0].c === 'GAS NOVIEMBRE';
    out.histOctEstable = JSON.stringify(S.hist['2026-10']) === out.histOct1; // NO reescrito

    /* 3b) cierre de Noviembre (primera vez) → genera su historial */
    mesMas(1);
    out.mTrasCierreNov = S.m; // 11 = Diciembre
    const histNov1 = JSON.stringify(S.hist['2026-11']);

    /* 3c) volvemos a Noviembre, lo MODIFICAMOS de verdad y lo re-cerramos:
       ahí SÍ debe avisar y reescribir el historial */
    mesMas(-1); // vuelve a Noviembre (restaurado desde S.live)
    const pNov3 = S.props.find(x => x.cod == '2-0');
    pNov3.sv.agua.monto = 77777; // cambio real
    mesMas(1); // re-cierra Noviembre

    /* avisos del confirm */
    const conf = window.__CONFIRMS || [];
    /* los 3 primeros confirms: cierre de Octubre, retroceso y RE-CIERRE de
       Octubre (sin cambios) → ninguno debe avisar del re-cierre */
    out.sinAvisoSiNoCambio = !conf.slice(0, nTrasPrimerCierre + 2).some(t => t.includes('ya estaba cerrado y lo modificaste'));
    /* los confirms posteriores incluyen el re-cierre de Noviembre CON cambios */
    out.avisoSiCambio = conf.slice(nTrasPrimerCierre + 2).some(t => t.includes('ya estaba cerrado y lo modificaste'));
    out.avisoDiceRespaldos = conf.some(t => t.includes('queda en Respaldos'));
    out.avisoNoCierraParaGuardar = conf.some(t => t.includes('no hace falta cerrar'));
    out.histNovReescrito = JSON.stringify(S.hist['2026-11']) !== histNov1;
    out.volverAviso = conf.some(t => t.includes('queda guardado'));
    out.nAvisos = conf.length;

    /* 4) año: Diciembre → Enero del año siguiente (nav entre años) */
    S.m = 11; // Diciembre
    mesMas(1);
    out.yTrasAnioNuevo = S.y; // 2027
    out.liveAnioNuevo = !!(S.live && S.live['2026-12']);

    out.ok = true;
  } catch (e) {
    out.err = (e && e.message) || String(e);
  }
  return out;
};
</script>
</body>
</html>
